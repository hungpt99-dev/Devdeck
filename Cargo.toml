[workspace]
resolver = "2"
members = ["crates/*", "app", "cli", "xtask"]
exclude = ["spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hungpt99-dev/Devdeck"
rust-version = "1.100"

[workspace.dependencies]
devdeck-core = { version = "0.1.0", path = "crates/core" }
devdeck-tools = { version = "0.1.0", path = "crates/tools" }
devdeck-ui = { version = "0.1.0", path = "crates/ui" }
devdeck-i18n = { version = "0.1.0", path = "crates/i18n" }
devdeck-extension-api = { version = "0.1.0", path = "crates/extension-api" }
devdeck-audit = { version = "0.1.0", path = "crates/audit" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.54.1", features = ["sync", "rt", "time"] }
schemars = "=1.2.3"
clap = { version = "=4.6.9", features = ["derive"] }
fluent = "=0.17.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
icu = "=2.4.0"
sys-locale = "=0.3.2"
semver = { version = "=1.0.28", features = ["serde"] }
toml = "=0.8.23"
sha2 = "=0.10.9"
iced = { version = "=0.14.0", features = ["tokio", "canvas"] }
unicode-normalization = "=0.1.26"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
