# cargo-deny policy. New licenses require a justified PR and an exception here.

[graph]
targets = []
all-features = true

[advisories]
version = 2
ignore = []
yanked = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Duplicate versions currently come only from transitive Iced/ICU dependencies.
# Track and reduce them; direct duplicates are a PR blocker.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# IND-213 justification: portable-pty 0.9.0 is MIT and vte 0.15.0 is
# Apache-2.0 OR MIT (both already covered by `allow` above, no exception
# needed). Both are exact-pinned in [workspace.dependencies]; portable-pty's
# transitive set (nix, filedescriptor, serial2, shell-words, winapi) is likewise
# permissive. `cargo deny check` passes with no new exceptions.
